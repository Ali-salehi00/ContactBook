
<!DOCTYPE html>
<html>
<head>
    <title>ContactBook</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f3f4f6;
            color: #222;
            margin: 0;
            padding: 40px;
        }

        .container {
            max-width: 700px;
            margin: auto;
        }

        h1 {
            color: #1f2937;
        }

        .contact-card {
            background: white;
            padding: 20px;
            margin-bottom: 15px;
            border-radius: 10px;
        }

        a {
            color: #2563eb;
            text-decoration: none;
            font-weight: bold;
        }

        a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>My Contacts</h1>

        {% for contact in contacts %}

            <div class="contact-card">

                <a href="{% url 'contact_detail' contact.id %}">
                    {{ contact.name }}
                </a>

                

            </div>

        {% empty %}

            <p>No contacts found!</p>

        {% endfor %}

    </div>

</body>
</html>
